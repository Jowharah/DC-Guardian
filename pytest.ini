[pytest]
# importlib import mode: test files with the same name in different folders
# (evidence/*/tests/test_config.py) are collected without __init__.py files.
addopts = --import-mode=importlib
pythonpath = .
# Markers from the testing plan (docs/WORK_LOG.md, item 3). Select with -m, e.g. -m "not neo4j".
markers =
    neo4j: needs a running Neo4j (bolt://127.0.0.1:7687); skipped when unreachable
    gpu: needs a CUDA-enabled component environment (.venv-ppe/.venv-gru); skipped elsewhere
    private_data(*paths): needs local data excluded from Git; skipped when a path is missing (see conftest.py)
